<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="url(#grad)"/>
  
  <!-- FL Monogram -->
  <text x="50" y="70" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle">FL</text>
  
  <!-- Decorative element (Pakistani motif inspired) -->
  <circle cx="50" cy="20" r="3" fill="white" opacity="0.8"/>
  <circle cx="42" cy="23" r="2" fill="white" opacity="0.6"/>
  <circle cx="58" cy="23" r="2" fill="white" opacity="0.6"/>
</svg>
